name: iOS 单平台打包
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ios-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 读取并校验版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' apps/fideflow_flutter/pubspec.yaml | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v${version%%+*}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: 准备依赖
        run: |
          brew install cmake nasm pkg-config autoconf automake libtool
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          flutter pub get --enforce-lockfile
      - run: tooling/release/ios/package.sh
      - name: 整理 Release 文件
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tooling/release/github_assets.py --source "build/release/ios/$VERSION" \
            --output build/github-assets/ios --platform ios --arch arm64 --revision "$GITHUB_SHA" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: Fideflow-ios-arm64-${{ steps.version.outputs.version }}
          path: build/github-assets/ios/*
          if-no-files-found: error
          retention-days: 14
