name: Linux 单平台打包
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: linux-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact_arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            artifact_arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 读取并校验版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' apps/fideflow_flutter/pubspec.yaml | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v${version%%+*}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x86_64'
        with:
          flutter-version: '3.47.5'
          channel: stable
      # The Linux release manifest has no ARM64 SDK archive for this version.
      - name: Install Flutter from the pinned tag on ARM64
        if: matrix.arch == 'aarch64'
        shell: bash
        env:
          FLUTTER_VERSION: '3.47.5'
        run: |
          flutter_root="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$flutter_root"
          echo "FLUTTER_ROOT=$flutter_root" >> "$GITHUB_ENV"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
          "$flutter_root/bin/flutter" --version
          "$flutter_root/bin/flutter" precache --linux
      - name: 准备依赖
        run: |
          tooling/bootstrap-linux.sh --for build
          cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.arch }}-unknown-linux-gnu' --manifest-path native/media_core/Cargo.toml > /dev/null
          tooling/bootstrap-linux.sh --for package --install
          flutter pub get --enforce-lockfile
      - name: 构建原生依赖与应用
        run: |
          tooling/native/linux/build.sh all --arch host
          cd apps/fideflow_flutter
          flutter build linux --release
      - name: 打包并验证
        run: |
          python3 tooling/release/linux/package.py
          python3 tooling/release/linux/verify_artifacts.py 'build/release/linux/${{ steps.version.outputs.version }}/${{ matrix.arch }}'
      - name: 整理 Release 文件
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 tooling/release/github_assets.py --source "build/release/linux/$VERSION/$ARCH" \
            --output build/github-assets/linux --platform linux --arch "$ARCH" --revision "$GITHUB_SHA" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: Fideflow-linux-${{ matrix.artifact_arch }}-${{ steps.version.outputs.version }}
          path: build/github-assets/linux/*
          if-no-files-found: error
          retention-days: 14
